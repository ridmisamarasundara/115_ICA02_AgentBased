{% extends "base.html" %}
{% block title %}Register - EventSphere{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-6 col-lg-4">
  <h1 class="h4 mb-3">Create an account</h1>
  {% if errors %}<div class="alert alert-danger"><ul class="mb-0">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3"><label class="form-label" for="name">Full name</label>
      <input class="form-control" id="name" name="name" value="{{ form.get('name', '') }}" required></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" value="{{ form.get('email', '') }}" required></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" minlength="8" required>
      <div class="form-text">At least 8 characters with a letter and a number.</div></div>
    <div class="mb-3"><label class="form-label" for="confirm">Confirm password</label>
      <input class="form-control" id="confirm" name="confirm" type="password" required></div>
    <button class="btn btn-primary w-100">Register</button>
  </form>
  <p class="mt-3 small">Already registered? <a href="/login">Login</a></p>
</div></div>
{% endblock %}
