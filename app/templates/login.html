{% extends "base.html" %}
{% block title %}Login - EventSphere{% endblock %}
{% block content %}
<div class="es-auth">
  <div class="es-panel">
    <h1 class="es-title">Welcome back</h1>
    <p class="es-meta">Login to book tickets and manage your bookings.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
  </div>
  <p class="text-center small">No account? <a href="/register">Register</a></p>
</div>
{% endblock %}
